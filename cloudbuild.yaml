# ============================================================
# Google Cloud Build — CI/CD Pipeline
# Builds Docker image & deploys to Cloud Run
# ============================================================
#
# SETUP (one-time):
#   1. Enable APIs:
#      gcloud services enable cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com
#
#   2. Create Artifact Registry repo:
#      gcloud artifacts repositories create ai-ecom-builder --repository-format=docker --location=us-central1
#
#   3. Store secrets in Secret Manager:
#      echo -n "postgresql://..." | gcloud secrets create DATABASE_URL --data-file=-
#      echo -n "https://xxx.supabase.co" | gcloud secrets create SUPABASE_URL --data-file=-
#      echo -n "eyJ..." | gcloud secrets create SUPABASE_SERVICE_ROLE_KEY --data-file=-
#      echo -n "sk-ant-..." | gcloud secrets create CLAUDE_API_KEY --data-file=-
#      echo -n "ecom_store" | gcloud secrets create DB_SCHEMA --data-file=-
#
#   4. Grant Cloud Build access to secrets + Cloud Run:
#      PROJECT_NUM=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:${PROJECT_NUM}@cloudbuild.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:${PROJECT_NUM}@cloudbuild.gserviceaccount.com" \
#        --role="roles/run.admin"
#      gcloud iam service-accounts add-iam-policy-binding \
#        ${PROJECT_NUM}-compute@developer.gserviceaccount.com \
#        --member="serviceAccount:${PROJECT_NUM}@cloudbuild.gserviceaccount.com" \
#        --role="roles/iam.serviceAccountUser"
#
#   5. Deploy:
#      gcloud builds submit --config=cloudbuild.yaml .
#
# ============================================================

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: ai-ecom-builder
  _REPO_NAME: ai-ecom-builder

# Only real secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_URL/versions/latest
      env: SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_SERVICE_ROLE_KEY/versions/latest
      env: SUPABASE_SERVICE_ROLE_KEY
    - versionName: projects/$PROJECT_ID/secrets/CLAUDE_API_KEY/versions/latest
      env: CLAUDE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/DB_SCHEMA/versions/latest
      env: DB_SCHEMA

steps:
  # ── Step 1: Build Docker image ─────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          --build-arg SUPABASE_URL="$$SUPABASE_URL" \
          --build-arg SUPABASE_SERVICE_ROLE_KEY="$$SUPABASE_SERVICE_ROLE_KEY" \
          --build-arg CLAUDE_API_KEY="$$CLAUDE_API_KEY" \
          --build-arg DB_SCHEMA="$$DB_SCHEMA" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest \
          .
    secretEnv:
      - DATABASE_URL
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - CLAUDE_API_KEY
      - DB_SCHEMA

  # ── Step 2: Push to Artifact Registry ──────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}'

  # ── Step 3: Deploy to Cloud Run ────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=1Gi \
          --cpu=2 \
          --min-instances=0 \
          --max-instances=5 \
          --timeout=600 \
          --set-secrets=DATABASE_URL=DATABASE_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,CLAUDE_API_KEY=CLAUDE_API_KEY:latest,DB_SCHEMA=DB_SCHEMA:latest \
          --set-env-vars=NODE_ENV=production

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
